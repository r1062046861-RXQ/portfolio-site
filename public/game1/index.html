<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203c41">
  <meta name="description" content="一个班，两个人轮着上。今天谁上班，可玩的生活经营Demo。">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="modulepreload" href="engine.js">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="portrait.css">
  <link rel="stylesheet" href="art-direction.css">
  <link rel="stylesheet" href="fixed-stage.css">
  <link rel="stylesheet" href="floating-ui.css">
  <link rel="stylesheet" href="menu.css">
  <title>今天谁上班 · 生活经营 Demo V0.6.1</title>
</head>
<body>
  <section id="main-menu" class="main-menu" aria-label="游戏主菜单">
    <img class="menu-cover" src="assets/menu-cover.webp" alt="清晨，猫与狐狸室友在蓝门前交接钥匙" width="1024" height="1536">
    <div class="menu-heading"><h1><img class="menu-title" src="assets/ui/menu-title.webp" alt="今天谁上班" width="1000" height="640"></h1><p>一个班，两个人轮着上。</p></div>
    <div class="menu-actions">
      <p class="menu-save" id="menu-save" aria-live="polite">正在读取你的进度……</p>
      <button id="menu-continue" class="menu-button menu-continue" disabled><span>继续游戏</span><i data-lucide="arrow-right"></i></button>
      <button id="menu-new" class="menu-button menu-new"><span>新游戏</span><i data-lucide="sunrise"></i></button>
      <p class="menu-storage" id="menu-storage">你的进度，只保存在这台设备的浏览器里。</p>
    </div>
  </section>
  <div class="app-shell" id="game-shell" hidden inert>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><i data-lucide="calendar-heart"></i></span><div><h1><img loading="lazy" class="title-lettering" src="assets/ui/title-lettering.webp" alt="今天谁上班" width="640" height="153"></h1><p>一个班，两个人轮着上。</p></div></div>
      <div class="header-actions"><div class="wallet" aria-label="生活账户"><i data-lucide="coins"></i><span id="cash">500</span><small>生活币</small></div><button id="sound" class="icon-button" title="开启声音" aria-label="开启声音"><i data-lucide="volume-x"></i></button><button id="settings" class="icon-button" title="存档与设置" aria-label="存档与设置"><i data-lucide="settings-2"></i></button></div>
    </header>
    <main class="workspace">
      <section class="living-area" aria-label="我们的生活">
        <div class="scene" id="scene">
          <img loading="lazy" class="scene-background" id="scene-bg" src="assets/apartment.webp" alt="阳光照进两个人的合租房">
          <div class="scene-top"><div class="date-ribbon"><span id="week">第 1 周</span><b id="day">周一</b><i data-lucide="sun"></i></div><div class="scene-switch" aria-label="场景"><button data-scene="home" class="active" title="回家" aria-label="回家"><i data-lucide="house"></i></button><button data-scene="town" title="小镇" aria-label="小镇"><i data-lucide="store"></i></button></div></div>
          <div id="props" class="props"></div>
          <div class="scene-messages"><div class="scene-caption" id="scene-caption"><i data-lucide="key-round"></i><span>我们的合租小屋</span></div><div id="speech" class="speech">阿闲：我把周一三五让出来一半，行吗？</div></div>
          <button class="actor actor-a" data-person="0" title="查看阿闲" aria-label="查看阿闲"><img loading="lazy" id="actor-a" src="assets/characters-0.webp" alt="阿闲，戴眼镜的猫室友"><span>阿闲</span></button>
          <button class="actor actor-b" data-person="1" title="查看阿忙" aria-label="查看阿忙"><img loading="lazy" id="actor-b" src="assets/characters-2.webp" alt="阿忙，穿格纹长外套的狐狸室友"><span>阿忙</span></button>
          <div id="day-overlay" class="day-overlay" hidden><span id="day-overlay-text"></span></div>
        </div>
        <div class="people-strip" id="people"></div>
        <div class="wish-band"><i data-lucide="sparkles"></i><div><small>本周小心愿</small><b id="wish-title"></b></div><button id="wish-button" class="icon-button" title="查看心愿" aria-label="查看心愿"><i data-lucide="chevron-right"></i></button></div>
        <nav class="tabs" aria-label="游戏页面"><button class="active" data-tab="plan"><i data-lucide="calendar-days"></i><span>排班</span></button><button data-tab="home"><i data-lucide="armchair"></i><span>小家</span></button><button data-tab="jobs"><i data-lucide="briefcase-business"></i><span>找班</span></button><button data-tab="diary"><i data-lucide="notebook-pen"></i><span>日记</span></button></nav>
        <div id="content" class="content-area"></div>
      </section>
      <section class="planner" id="planner" aria-label="本周日程">
        <div class="planner-heading"><div><small id="planner-eyebrow">分班，也分一点闲。</small><h2>这周怎么过</h2></div><div class="panel-tools"><button id="preset" class="icon-button" title="快速安排" aria-label="快速安排"><i data-lucide="wand-sparkles"></i></button><button class="icon-button" data-close-panel title="收起日程" aria-label="收起日程"><i data-lucide="x"></i></button></div></div>
        <button id="contract" class="contract"><span class="contract-icon"><i data-lucide="store"></i></span><span><b id="job-name">小店值班员</b><small>共享合同 · 六天，一天一个班</small></span><strong id="job-pay">100<small>币 / 班</small></strong><i data-lucide="chevron-right"></i></button>
        <div class="schedule-labels"><span>日期</span><span class="label-a">阿闲</span><span class="label-b">阿忙</span></div>
        <div class="schedule" id="schedule"></div>
        <div class="forecast" id="forecast" aria-live="polite"></div>
      </section>
    </main>
    <div class="run-area"><button id="run" class="primary-button"><i data-lucide="play"></i><span>开始周一</span></button><span id="save-status" class="save-status">进度已保存</span></div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><div><small id="modal-eyebrow"></small><h2 id="modal-title"></h2></div><button class="icon-button" id="close-modal" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="modal-body"></div><nav id="modal-pager" class="pager" aria-label="弹窗分页" hidden></nav></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="vendor/lucide.min.js"></script>
  <script type="module" src="app.js?v=0.6.1"></script>
</body>
</html>
